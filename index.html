<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Launchpad</title>
<style>
  :root{
    --bg:#0d0f0c;
    --ink:#eef0ea;
    --muted:#8b9186;
    --glass: rgba(255,255,255,0.045);
    --glass-border: rgba(255,255,255,0.09);
    --gold:#e8b64a;
    --teal:#4fd1b8;
    --coral:#ff8a63;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 20% -10%, rgba(232,182,74,0.10), transparent 40%),
      radial-gradient(circle at 85% 110%, rgba(79,209,184,0.10), transparent 45%),
      var(--bg);
    color:var(--ink);
    font-family: 'Segoe UI', Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 18px;
    padding-top: calc(32px + env(safe-area-inset-top));
    padding-bottom: calc(32px + env(safe-area-inset-bottom));
  }
  .wrap{width:100%;max-width:540px;}

  header{margin-bottom:28px;text-align:center;position:relative;}
  .eyebrow{
    font-size:11px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 10px;
    font-weight:600;
  }
  h1{
    font-family: Georgia, 'Times New Roman', serif;
    font-weight:400;
    font-size:34px;
    margin:0;
    letter-spacing:-.01em;
    color:#f5f3ec;
  }

  .layout-toggle{
    position:relative;
    display:inline-flex;
    justify-content:center;
    gap:2px;
    margin:20px auto 0;
    padding:3px;
    border-radius:22px;
    background:var(--glass);
    border:1px solid var(--glass-border);
  }
  .toggle-btn{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    gap:6px;
    padding:7px 16px;
    border-radius:18px;
    background:transparent;
    border:none;
    color:var(--muted);
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    transition: color .25s ease;
  }
  .toggle-btn svg{width:14px;height:14px;}
  .toggle-btn:hover{color:var(--ink);}
  .toggle-btn.active{color:#14150f;}
  .toggle-pill{
    position:absolute;
    top:3px;
    bottom:3px;
    left:3px;
    width:calc(50% - 3px);
    border-radius:18px;
    background:#f5f3ec;
    box-shadow:0 2px 10px -2px rgba(0,0,0,0.4);
    transition: transform .3s cubic-bezier(.4,0,.2,1);
  }
  .layout-toggle.grid-active .toggle-pill{transform:translateX(100%);}

  .cards{display:flex;flex-direction:column;gap:16px;}
  .cards a.card{
    animation: cardIn .35s ease backwards;
  }
  .cards a.card:nth-child(1){animation-delay:.02s;}
  .cards a.card:nth-child(2){animation-delay:.06s;}
  .cards a.card:nth-child(3){animation-delay:.1s;}
  .cards a.card:nth-child(4){animation-delay:.14s;}
  .cards a.card:nth-child(5){animation-delay:.18s;}
  .cards a.card:nth-child(6){animation-delay:.22s;}
  @keyframes cardIn{
    from{opacity:0; transform:translateY(8px) scale(.98);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  a.card{
    position:relative;
    display:flex;
    align-items:center;
    gap:16px;
    text-decoration:none;
    color:var(--ink);
    padding:22px 22px;
    min-height:64px;
    border-radius:16px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter: blur(6px);
    transition: transform .22s ease, border-color .22s ease, background .22s ease;
    touch-action: manipulation;
  }
  a.card:hover{
    transform: translateY(-3px);
    background: rgba(255,255,255,0.075);
  }
  a.card:active{transform: translateY(-1px);}

  .card1{border-left:3px solid var(--gold);}
  .card2{border-left:3px solid var(--teal);}
  .card3{border-left:3px solid var(--coral);}
  .card4{border-left:3px solid #b48cff;}
  .card5{border-left:3px solid #5fa8ff;}
  .card6{border-left:3px solid #ff6fa5;}

  .icon{
    flex-shrink:0;
    width:44px;
    height:44px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon1{background:rgba(232,182,74,0.14); box-shadow:0 0 22px -4px rgba(232,182,74,0.35);}
  .icon2{background:rgba(79,209,184,0.14); box-shadow:0 0 22px -4px rgba(79,209,184,0.35);}
  .icon3{background:rgba(255,138,99,0.14); box-shadow:0 0 22px -4px rgba(255,138,99,0.35);}
  .icon4{background:rgba(180,140,255,0.14); box-shadow:0 0 22px -4px rgba(180,140,255,0.35);}
  .icon5{background:rgba(95,168,255,0.14); box-shadow:0 0 22px -4px rgba(95,168,255,0.35);}
  .icon6{background:rgba(255,111,165,0.14); box-shadow:0 0 22px -4px rgba(255,111,165,0.35);}
  .icon svg{width:22px;height:22px;}

  .text{flex:1;min-width:0;}
  .name{
    font-size:18px;
    font-weight:600;
    margin:0 0 3px;
    letter-spacing:-.01em;
    color:#f5f3ec;
  }
  .desc{
    font-size:12.5px;
    margin:0;
    color:var(--muted);
  }

  .arrow{
    flex-shrink:0;
    width:28px;
    height:28px;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
    border:1px solid var(--glass-border);
    display:flex;
    align-items:center;
    justify-content:center;
    transition: transform .22s ease;
  }
  a.card:hover .arrow{transform: translateX(3px);}
  .arrow svg{width:13px;height:13px;}

  .cards.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
  }
  .cards.grid a.card{
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    aspect-ratio:1/1;
    height:100%;
    padding:18px 14px;
    gap:10px;
    border-left:none;
    border-top:3px solid transparent;
    position:relative;
    overflow:hidden;
  }
  .cards.grid a.card::before{
    content:"";
    position:absolute;
    inset:0;
    opacity:0;
    transition:opacity .25s ease;
    pointer-events:none;
  }
  .cards.grid a.card:hover::before{opacity:1;}
  .cards.grid .card1{border-top-color:var(--gold);}
  .cards.grid .card1::before{background:radial-gradient(circle at 50% 0%, rgba(232,182,74,0.10), transparent 70%);}
  .cards.grid .card2{border-top-color:var(--teal);}
  .cards.grid .card2::before{background:radial-gradient(circle at 50% 0%, rgba(79,209,184,0.10), transparent 70%);}
  .cards.grid .card3{border-top-color:var(--coral);}
  .cards.grid .card3::before{background:radial-gradient(circle at 50% 0%, rgba(255,138,99,0.10), transparent 70%);}
  .cards.grid .card4{border-top-color:#b48cff;}
  .cards.grid .card4::before{background:radial-gradient(circle at 50% 0%, rgba(180,140,255,0.10), transparent 70%);}
  .cards.grid .card5{border-top-color:#5fa8ff;}
  .cards.grid .card5::before{background:radial-gradient(circle at 50% 0%, rgba(95,168,255,0.10), transparent 70%);}
  .cards.grid .card6{border-top-color:#ff6fa5;}
  .cards.grid .card6::before{background:radial-gradient(circle at 50% 0%, rgba(255,111,165,0.10), transparent 70%);}
  .cards.grid a.card:hover{transform:translateY(-4px) scale(1.02);}
  .cards.grid .icon{
    width:52px;
    height:52px;
  }
  .cards.grid .icon svg{width:26px;height:26px;}
  .cards.grid .text{flex:none; display:flex; flex-direction:column; align-items:center;}
  .cards.grid .name{font-size:14.5px;}
  .cards.grid .desc{font-size:11px; line-height:1.4;}
  .cards.grid .arrow{display:none;}

  footer{
    text-align:center;
    margin-top:36px;
    font-size:11px;
    color:var(--muted);
  }

  @media (max-width:420px){
    h1{font-size:25px;}
    .eyebrow{font-size:10px;}
    a.card{padding:16px 16px;gap:12px;min-height:58px;}
    .icon{width:40px;height:40px;}
    .icon svg{width:20px;height:20px;}
    .name{font-size:15px;}
    .desc{font-size:11.5px;}
    .arrow{width:26px;height:26px;}
  }

  @media (max-width:340px){
    .desc{display:none;}
  }
</style>
</head>
<body>

<script>
  function setLayout(mode){
    var wrap = document.getElementById('cardsWrap');
    var toggle = document.getElementById('layoutToggle');
    var listBtn = document.getElementById('listBtn');
    var gridBtn = document.getElementById('gridBtn');
    var cards = wrap.querySelectorAll('a.card');

    cards.forEach(function(c){
      c.style.animation = 'none';
      void c.offsetWidth;
      c.style.animation = '';
    });

    if(mode === 'grid'){
      wrap.classList.add('grid');
      toggle.classList.add('grid-active');
      gridBtn.classList.add('active');
      listBtn.classList.remove('active');
    } else {
      wrap.classList.remove('grid');
      toggle.classList.remove('grid-active');
      listBtn.classList.add('active');
      gridBtn.classList.remove('active');
    }
    try{ localStorage.setItem('launchpad-layout', mode); }catch(e){}
  }
  (function(){
    var saved;
    try{ saved = localStorage.getItem('launchpad-layout'); }catch(e){}
    if(saved === 'list') setLayout('list');
    else setLayout('grid');
  })();
</script>
</body>
</html>
