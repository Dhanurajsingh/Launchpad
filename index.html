<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Launchpad</title>
<style>
  :root{
    --bg:#0d0f0c;
    --ink:#eef0ea;
    --muted:#8b9186;
    --glass: rgba(255,255,255,0.045);
    --glass-border: rgba(255,255,255,0.09);
    --gold:#e8b64a;
    --teal:#4fd1b8;
    --coral:#ff8a63;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 20% -10%, rgba(232,182,74,0.10), transparent 40%),
      radial-gradient(circle at 85% 110%, rgba(79,209,184,0.10), transparent 45%),
      var(--bg);
    color:var(--ink);
    font-family: 'Segoe UI', Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 18px;
    padding-top: calc(32px + env(safe-area-inset-top));
    padding-bottom: calc(32px + env(safe-area-inset-bottom));
  }
  .wrap{width:100%;max-width:540px;}

  header{margin-bottom:44px;text-align:center;}
  .eyebrow{
    font-size:11px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 10px;
    font-weight:600;
  }
  h1{
    font-family: Georgia, 'Times New Roman', serif;
    font-weight:400;
    font-size:34px;
    margin:0;
    letter-spacing:-.01em;
    color:#f5f3ec;
  }

  .cards{display:flex;flex-direction:column;gap:16px;}

  a.card{
    position:relative;
    display:flex;
    align-items:center;
    gap:16px;
    text-decoration:none;
    color:var(--ink);
    padding:22px 22px;
    min-height:64px;
    border-radius:16px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter: blur(6px);
    transition: transform .22s ease, border-color .22s ease, background .22s ease;
    touch-action: manipulation;
  }
  a.card:hover{
    transform: translateY(-3px);
    background: rgba(255,255,255,0.075);
  }
  a.card:active{transform: translateY(-1px);}

  .card1{border-left:3px solid var(--gold);}
  .card2{border-left:3px solid var(--teal);}
  .card3{border-left:3px solid var(--coral);}

  .icon{
    flex-shrink:0;
    width:44px;
    height:44px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon1{background:rgba(232,182,74,0.14); box-shadow:0 0 22px -4px rgba(232,182,74,0.35);}
  .icon2{background:rgba(79,209,184,0.14); box-shadow:0 0 22px -4px rgba(79,209,184,0.35);}
  .icon3{background:rgba(255,138,99,0.14); box-shadow:0 0 22px -4px rgba(255,138,99,0.35);}
  .icon svg{width:22px;height:22px;}

  .text{flex:1;min-width:0;}
  .name{
    font-size:18px;
    font-weight:600;
    margin:0 0 3px;
    letter-spacing:-.01em;
    color:#f5f3ec;
  }
  .desc{
    font-size:12.5px;
    margin:0;
    color:var(--muted);
  }

  .arrow{
    flex-shrink:0;
    width:28px;
    height:28px;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
    border:1px solid var(--glass-border);
    display:flex;
    align-items:center;
    justify-content:center;
    transition: transform .22s ease;
  }
  a.card:hover .arrow{transform: translateX(3px);}
  .arrow svg{width:13px;height:13px;}

  footer{
    text-align:center;
    margin-top:36px;
    font-size:11px;
    color:var(--muted);
  }

  @media (max-width:420px){
    h1{font-size:25px;}
    .eyebrow{font-size:10px;}
    a.card{padding:16px 16px;gap:12px;min-height:58px;}
    .icon{width:40px;height:40px;}
    .icon svg{width:20px;height:20px;}
    .name{font-size:15px;}
    .desc{font-size:11.5px;}
    .arrow{width:26px;height:26px;}
  }

  @media (max-width:340px){
    .desc{display:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Your Apps</p>
    <h1>Launchpad</h1>
  </header>

  <div class="cards">
    <a class="card card1" href="https://shauryasinghmanager-gif.github.io/Money-manager/" target="_blank" rel="noopener noreferrer">
      <div class="icon icon1">
        <svg viewBox="0 0 24 24" fill="none" stroke="#e8b64a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M9 9.5c0-1 .9-1.8 2-1.8h1.3c1.1 0 2 .7 2 1.6 0 1-.8 1.4-2 1.7-1.5.4-2.3.8-2.3 1.9 0 .9.9 1.6 2 1.6H14c1.1 0 2-.7 2-1.6"/>
          <path d="M12 6.5v1.2M12 16.3v1.2"/>
        </svg>
      </div>
      <div class="text">
        <p class="name">Money Manager</p>
        <p class="desc">Track spending & balances</p>
      </div>
      <div class="arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="#e8e6df" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 17L17 7M9 7h8v8"/>
        </svg>
      </div>
    </a>

    <a class="card card2" href="https://shauryasinghmanager-gif.github.io/Fina/" target="_blank" rel="noopener noreferrer">
      <div class="icon icon2">
        <svg viewBox="0 0 24 24" fill="none" stroke="#4fd1b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10l9-6 9 6"/>
          <path d="M5 10v9h14v-9"/>
          <path d="M10 19v-5h4v5"/>
        </svg>
      </div>
      <div class="text">
        <p class="name">Bhandara Bank</p>
        <p class="desc">Banking & account overview</p>
      </div>
      <div class="arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="#e8e6df" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 17L17 7M9 7h8v8"/>
        </svg>
      </div>
    </a>

    <a class="card card3" href="https://shauryasinghmanager-gif.github.io/Gaadikhata/" target="_blank" rel="noopener noreferrer">
      <div class="icon icon3">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ff8a63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 16l1.5-5.5A2 2 0 0 1 7.4 9h9.2a2 2 0 0 1 1.9 1.5L20 16"/>
          <path d="M4 16h16v3H4z"/>
          <circle cx="7.5" cy="19" r="1.3"/>
          <circle cx="16.5" cy="19" r="1.3"/>
        </svg>
      </div>
      <div class="text">
        <p class="name">Gaadikhata</p>
        <p class="desc">Vehicle expense ledger</p>
      </div>
      <div class="arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="#e8e6df" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 17L17 7M9 7h8v8"/>
        </svg>
      </div>
    </a>
  </div>

  <footer>Tap any card to open</footer>
</div>
</body>
</html>
